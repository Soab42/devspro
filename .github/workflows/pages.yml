# Publishes site/ (the landing page, changelog and the updater feed,
# site/latest.json) to GitHub Pages. Pages must be enabled with
# Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one halfway, or the live feed could
# be left out of step with the release it describes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the feed and changelog are valid JSON
        run: |
          python3 -m json.tool site/latest.json > /dev/null
          python3 -m json.tool site/changelog.json > /dev/null

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
