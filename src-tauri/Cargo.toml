[package]
name = "devsuite"
version = "0.1.0"
description = "Local development environment manager."
# Feeds the Debian package's Maintainer field — tauri-bundler reads it from
# here, not from bundle.publisher. Left at the template's ["you"], every
# package ships with `Maintainer: you`.
authors = ["soab42 <syfuddhin@email.com>"]
license = "MIT"
homepage = "https://github.com/Soab42/devspro"
repository = "https://github.com/Soab42/devspro"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devsuite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rcgen = "0.13"
time = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[workspace]
members = ["helper"]

# Applies to the app and the helper alike, since the helper is a workspace
# member. Debug symbols dominate an unstripped binary — the helper alone is 8 MB
# unstripped — and both get shipped inside the package.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Keep unwinding: the elevated helper should run its Drop impls on a panic
# rather than abort partway through applying a manifest.
panic = "unwind"

