[package]
name = "devspro"
version = "0.2.0"
description = "Local development environment manager."
# Feeds the Debian package's Maintainer field — tauri-bundler reads it from
# here, not from bundle.publisher. Left at the template's ["you"], every
# package ships with `Maintainer: you`.
authors = ["soab42 <syfuddhin@email.com>"]
license = "MIT"
homepage = "https://github.com/Soab42/devspro"
repository = "https://github.com/Soab42/devspro"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devspro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# wry directly, for the Browser module's positioned child webviews. Tauri's own
# multi-webview support can't place a child on Linux — see modules/browser.
wry = { version = "0.55", default-features = false, features = ["devtools"] }
aes-gcm = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
# x509-parser: needed to read the issuer DN back out of the root CA on disk when
# signing a leaf. Without it the DN had to be hardcoded, which silently broke
# every cert the moment the product was renamed — see ca::load_issuer.
rcgen = { version = "0.13", features = ["x509-parser"] }
time = "0.3"
portable-pty = "0.9.0"
ssh2 = "0.9.6"
# SFTP "Download as zip". Deflate only: the other formats bring C libraries for
# archives nobody asked for. flate2 is named here just to pick its pure-Rust
# backend rather than rely on another crate happening to choose one.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
tokio = { version = "1.53.1", features = ["net", "io-util", "sync", "macros", "time", "rt"] }
tokio-tungstenite = "0.30"
# The updater: checks a download's signature as it streams in (the helper checks
# it again, as root), and compares the feed's version with this build's.
minisign-verify = "0.3"
semver = "1"
futures-util = "0.3.34"

# The Browser module hosts each tab's WebKit widget inside the app window's
# GTK tree (a Fixed over the app webview) — see modules/browser/host.rs.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

# getuid(), to tell whether a private key is the user's own — the only kind
# OpenSSH checks the mode of (see modules/ssh/key_perms.rs). Windows checks the
# key's ACL instead, through windows-sys below.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    # Hands an RDP password to mstsc through Credential Manager rather than a
    # command line (src/modules/remote_desktop/mstsc.rs).
    "Win32_Security_Credentials",
    # The dashboard's system sources (src/modules/system/platform/windows.rs).
    # `Wdk_System_SystemInformation` is only for NtQuerySystemInformation, the one
    # documented way to read *per-core* CPU ticks — GetSystemTimes gives the
    # aggregate alone. Its result struct lives under Win32_System_WindowsProgramming.
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Wdk_System_SystemInformation",
    "Win32_Storage_FileSystem",
    # GPU usage and memory from the "GPU Engine"/"GPU Adapter Memory" performance
    # counters (Performance), keyed by adapter LUIDs from D3DKMT (Direct3D) — the
    # same sources Task Manager reads, for any vendor.
    "Win32_System_Performance",
    "Wdk_Graphics_Direct3D",
    # MIB_IF_ROW2's fields are typed from the Ndis namespace, so GetIfTable2 needs
    # both of these to compile, not just IpHelper. IpHelper also carries
    # GetExtendedTcpTable, which is how src/modules/processes lists listening ports.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    # Maps a listening port's owning pid to a process name, without needing the
    # OpenProcess rights that reading another user's process would.
    "Win32_System_Diagnostics_ToolHelp",
    # The Cleaner's Caches tab (src/modules/cleaner/caches): the user's SID names
    # their Recycle Bin folder on each drive, and NtQueryInformationProcess reads
    # another process's command line to tell an `npm install` from `npm run`.
    # Security is also how SSH reads and tightens a private key's ACL, which is
    # what Windows OpenSSH checks instead of mode bits (src/modules/ssh/key_perms.rs).
    "Win32_Security",
    "Win32_Security_Authorization",
    "Wdk_System_Threading",
    # The File Manager (src/modules/file_manager/windows.rs): known folders and
    # the Recycle Bin (Shell, with Com to free what the shell allocates), file
    # owners (Security), ejecting a stick (IO, Ioctl; Debug keeps an empty
    # card reader from raising a dialog) and disconnecting a mapped drive (WNet).
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Diagnostics_Debug",
    "Win32_NetworkManagement_WNet",
    # The Memory module (src/modules/memory/windows.rs): per-process RAM, owner and
    # command line, service state, and ending processes (also uses Security and
    # Wdk_System_Threading, listed above).
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Wdk_Foundation",
] }

[workspace]
members = ["helper"]

# Applies to the app and the helper alike, since the helper is a workspace
# member. Debug symbols dominate an unstripped binary — the helper alone is 8 MB
# unstripped — and both get shipped inside the package.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Keep unwinding: the elevated helper should run its Drop impls on a panic
# rather than abort partway through applying a manifest.
panic = "unwind"

# Dependencies' debug info was most of target/debug's size: about 22 GB of the
# 33 GB it had grown to. The workspace's own crates keep full debug info, so
# panics and backtraces in DevsPro code are unaffected.
[profile.dev.package."*"]
debug = false

